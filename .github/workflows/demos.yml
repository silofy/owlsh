name: Deploy demos

# Rebuilds the report UI on every push to main and publishes it to the
# silofy/owlsh-demos repo, whose GitHub Pages serves the public demos at
# https://silofy.github.io/owlsh-demos/. Keeps the demos matching the app
# instead of drifting stale.
#
# Auth: a deploy key scoped to silofy/owlsh-demos only. Its public half is a
# write-enabled deploy key on that repo; the private half is the DEMOS_DEPLOY_KEY
# secret here. To rotate: ssh-keygen -t ed25519, then replace both.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-demos
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build # vite base is "./", so it serves from the /owlsh-demos/ subpath
      - name: Publish to silofy/owlsh-demos
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEMOS_DEPLOY_KEY }}
          external_repository: silofy/owlsh-demos
          publish_branch: main
          publish_dir: ./dist
          # peaceiris adds .nojekyll automatically and replaces the branch contents
          commit_message: "Redeploy demos from ${{ github.sha }}"
