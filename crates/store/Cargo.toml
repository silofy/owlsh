[package]
name = "owlsh-store"
version = "0.2.0"
license = "AGPL-3.0-only"
edition = "2021"
description = "owlsh — encrypted SQLite store (SQLCipher), the daemon's single owner of telemetry (brief §8)"

[[bin]]
name = "owlsh-store"
path = "src/main.rs"

[lib]
name = "owlsh_store"
path = "src/lib.rs"

[dependencies]
# SQLCipher: transparent AES-256 page encryption. Vendored OpenSSL is built from source
# (needs perl + nasm on Windows MSVC).
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
