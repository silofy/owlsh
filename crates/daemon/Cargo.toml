[package]
name = "owlsh-daemon"
version = "0.2.0"
license = "AGPL-3.0-only"
edition = "2021"
description = "owlsh daemon — merges telemetry sources, re-redacts, owns session boundaries, persists to SQLCipher"

[[bin]]
name = "owlsh-daemon"
path = "src/main.rs"

[lib]
name = "owlsh_daemon"
path = "src/lib.rs"

[dependencies]
owlsh-core = { path = "../core" }
owlsh-store = { path = "../store" }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
